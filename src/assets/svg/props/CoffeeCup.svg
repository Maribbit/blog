<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120">
  <!-- 定义剪裁路径，利用基础图形拼接出完美的圆柱体轮廓，避免复杂的Path计算 -->
  <defs>
    <clipPath id="cup-body">
      <!-- 杯身中间矩形 -->
      <rect x="20" y="35" width="60" height="40" />
      <!-- 杯身底部圆弧 -->
      <ellipse cx="50" cy="75" rx="30" ry="12" />
      <!-- 杯身上半部分圆弧 -->
      <ellipse cx="50" cy="35" rx="30" ry="12" />
    </clipPath>
  </defs>

  <!-- 1. 桌面投影 (提取了原图中桌子阴影的清冷灰绿色调，并设为半透明以自然融合桌面) -->
  <ellipse cx="54" cy="77" rx="32" ry="11" fill="#A8B0B0" opacity="0.6" />

  <!-- 2. 杯把手 (放置在杯身下层，右侧探出) -->
  <path d="M 72 42 C 102 42, 102 68, 72 68 L 72 58 C 88 58, 88 50, 72 50 Z" fill="#C5C5C5" />

  <!-- 3. 杯身主体 (通过clipPath进行内部的光影切割) -->
  <g clip-path="url(#cup-body)">
    <!-- 基础白瓷色 (使用偏冷的极浅灰，呼应画面中白发与白大褂的色调) -->
    <rect x="10" y="20" width="80" height="80" fill="#EDEDED" />
    
    <!-- 右侧暗部阴影 (垂直切分的硬边阴影，完美契合原图中桌子和窗台的几何光影风格) -->
    <rect x="50" y="20" width="40" height="80" fill="#CCCCCC" />
    
    <!-- 左侧高光 (增加材质的圆润感和光泽度) -->
    <rect x="23" y="20" width="5" height="80" fill="#FFFFFF" />
  </g>

  <!-- 4. 杯口内壁 (颜色略深，表现内部空间) -->
  <ellipse cx="50" cy="35" rx="30" ry="12" fill="#D9D9D9" />

  <!-- 5. 咖啡液体 (使用了原图黑板和裙子的深灰色，保持整体配色的克制) -->
  <ellipse cx="50" cy="37.5" rx="26" ry="9.5" fill="#2E2E2E" />

  <!-- 6. 咖啡液面的微小反光细节 -->
  <ellipse cx="42" cy="35.5" rx="4" ry="1.5" fill="#454545" />
  <ellipse cx="65" cy="38" rx="2" ry="1" fill="#1A1A1A" />
</svg>
