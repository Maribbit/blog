<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Hexagonal clock face, matching the wall clock in the scene -->
  <polygon points="32,3 56.5,17.5 56.5,46.5 32,61 7.5,46.5 7.5,17.5"
    fill="#eef2f3" stroke="#c2cacd" stroke-width="2.5" stroke-linejoin="miter"/>
  <!-- Ticks: 12 / 3 / 6 / 9 -->
  <rect x="30.8" y="9" width="2.4" height="5" fill="#79838a"/>
  <rect x="30.8" y="50" width="2.4" height="5" fill="#79838a"/>
  <rect x="50" y="30.8" width="5" height="2.4" fill="#79838a"/>
  <rect x="9" y="30.8" width="5" height="2.4" fill="#79838a"/>
  <!-- Hands at a fixed 10:10 pose for the static fallback -->
  <rect x="30.6" y="20" width="2.8" height="12" fill="#2d3338"
    transform="rotate(50 32 32)"/>
  <rect x="30.9" y="15" width="2.2" height="17" fill="#2d3338"
    transform="rotate(20 32 32)"/>
  <rect x="31.3" y="11" width="1.3" height="21" fill="#94231f"
    transform="rotate(90 32 32)"/>
  <!-- Center hub -->
  <rect x="29.4" y="29.4" width="5.2" height="5.2" fill="#2d3338"
    transform="rotate(45 32 32)"/>
</svg>
