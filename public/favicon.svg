<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Round clock face, matching the wall clock in the scene -->
  <circle cx="32" cy="32" r="28.5" fill="#eef2f3" stroke="#c2cacd" stroke-width="2.5"/>
  <!-- Hands at a fixed 10:10 pose for the static fallback (no second hand) -->
  <rect x="30.6" y="20" width="2.8" height="12" fill="#2d3338"
    transform="rotate(50 32 32)"/>
  <rect x="30.9" y="15" width="2.2" height="17" fill="#2d3338"
    transform="rotate(20 32 32)"/>
  <!-- Center hub -->
  <rect x="29.4" y="29.4" width="5.2" height="5.2" fill="#2d3338"
    transform="rotate(45 32 32)"/>
</svg>
